## MintPy smallbaselineApp config for Usoi Dam (ISCE2 topsStack interferogram stack).
## Run from within each track's mintpy/ dir; paths are relative to it (../merged, ../reference, ../baselines).

mintpy.load.processor        = isce
##---------interferogram datasets:
mintpy.load.unwFile          = ../merged/interferograms/*/filt_*.unw
mintpy.load.corFile          = ../merged/interferograms/*/filt_*.cor
mintpy.load.connCompFile     = ../merged/interferograms/*/filt_*.unw.conncomp
##---------geometry:
mintpy.load.demFile          = ../merged/geom_reference/hgt.rdr
mintpy.load.lookupYFile      = ../merged/geom_reference/lat.rdr
mintpy.load.lookupXFile      = ../merged/geom_reference/lon.rdr
mintpy.load.incAngleFile     = ../merged/geom_reference/los.rdr
mintpy.load.azAngleFile      = ../merged/geom_reference/los.rdr
mintpy.load.shadowMaskFile   = ../merged/geom_reference/shadowMask.rdr
mintpy.load.waterMaskFile    = ../merged/geom_reference/waterMask.rdr
##---------metadata / baselines:
mintpy.load.metaFile         = ../reference/IW*.xml
mintpy.load.baselineDir      = ../baselines

## AOI (SNWE) — DISABLED: topsStack already cropped the stack to the AOI bursts, and
## MintPy bbox_geo2radar fails on the exact geo corner (radar swath != lat/lon rectangle:
## RuntimeError "No corresponding coordinate found for 38.1232/72.4535"). Full radar
## extent ~= AOI; geocoding at the end still produces geo outputs over the target.
mintpy.subset.lalo           = auto

## Reference point: EXPLICIT. Auto maxCoherence picked a pixel high in AVERAGE coherence
## but unreliable (connComp=0 / phase=0) in ~35% of interferograms, which corrupted the
## reference and drove temporalCoherence to ~0 everywhere. This pixel (radar y,x) is
## reliable (connComp>0) in 373/376 kept ifgs with avg coherence 0.99. NOTE: recompute
## per track (DSC differs) — pick max-coherence pixel within the common-reliable mask.
mintpy.reference.yx = 1035, 731
## No pixel is reliable in ALL kept ifgs (fragmented scene: lake + steep relief), so the
## default maskConnComp.h5 (reliable-in-all) is ~empty and vetoes any yx. Disable that mask
## check; the chosen yx is reliable in 373/376 ifgs which is more than enough.
mintpy.reference.maskFile = no

## Network: prune to SHORT temporal baselines + coherent pairs. The scene is largely
## decorrelated (Pamir: mean coherence ~0.35 even at 12 days) and long pairs unwrap badly,
## leaving NO region coherent+connected across all ifgs (empty common mask -> unwrap-error
## correction cannot run). Keeping only <=24-day pairs shrinks the stack so a common
## reliable region exists and phase_closure can work.
mintpy.network.coherenceBased  = yes
mintpy.network.keepMinSpanTree = yes
mintpy.network.minCoherence    = 0.3
mintpy.network.tempBaseMax     = 24

## Inversion
mintpy.networkInversion.weightFunc   = var
mintpy.networkInversion.minTempCoh   = 0.3

## Unwrap-error correction: NONE. Both bridging and phase_closure need a region that is
## coherent+connected across ALL kept ifgs, but the common mask is empty even for the
## short-baseline (<=24 d) network (seasonal coherence moves the coherent patches around).
## So we skip correction and instead rely on the short-baseline network (fewer unwrap
## errors) + a low temporal-coherence mask to keep only the consistently-good pixels.
mintpy.unwrapError.method    = no

## Corrections
mintpy.troposphericDelay.method = height_correlation
mintpy.topographicResidual      = yes
mintpy.deramp                   = linear

## Geocode outputs (produce geo/geo_velocity.h5 etc.)
mintpy.geocode               = yes

## Keep single-process for memory safety on the shared server (small AOI -> still fast)
mintpy.compute.cluster       = no
